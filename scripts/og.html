<!DOCTYPE html>
<!-- Source for site/og.png. Render at 1200x630 with scripts/build-social.sh;
     og-qr.svg is written by build.py, so run that first. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    /* Design system v2 ("retícula"), light theme only: warm paper, CMU Serif
       700 wordmark with the Pix mark in a teal block tilted -2deg as on the page, the
       tagline on a halftone shadow, and the page's own QR on white paper.
       The dot geometry is scaled up for a 1200px card read at thumbnail size. */
    @font-face{font-family:"CMU Serif";font-weight:700;src:url("https://static.joseli.to/assets/fonts/cmu-serif-700-roman.woff2") format("woff2")}
    @font-face{font-family:"CMU Typewriter Text";font-weight:700;src:url("https://static.joseli.to/assets/fonts/cmu-typewriter-text-700-roman.woff2") format("woff2")}
    :root {
      --surface-page: #F4F1EA; --surface-card: #FBF9F4; --text-1: #111111;
      --border-strong: #111111; --shadow-color: #111111;
      --ink-pix: #32BCAD; --on-pix: #000000;
      --dot-pitch: 6px; --dot-radius: 2px; --shadow-offset: 10px;
      --border: 3px solid var(--border-strong);
    }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface-page); }
    .frame {
      box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 64px;
      display: flex; align-items: center; justify-content: space-between; gap: 48px;
    }
    .text { display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .wordmark {
      margin: 0; color: var(--text-1); white-space: nowrap;
      font: 700 102px/1.1 "CMU Serif", Georgia, serif; letter-spacing: -.02em;
    }
    .wordmark span {
      display: inline-block; line-height: .92; padding: .06em .12em .1em;
      background: var(--ink-pix); color: var(--on-pix); transform: rotate(-2deg);
      padding: .12em .16em; vertical-align: -.08em;
    }
    /* Official Pix mark (symbol + logotype, monochrome positive on the light
       teal, as the brand manual asks for light coloured backgrounds). */
    .wordmark img { display: block; height: .62em; width: auto; }
    .cast { position: relative; isolation: isolate; border: var(--border); background-color: var(--surface-card); }
    .cast::after {
      content: ""; position: absolute; inset: -3px; z-index: -2;
      transform: translate(var(--shadow-offset), var(--shadow-offset));
      background: radial-gradient(circle at 50% 50%, var(--shadow-color) var(--dot-radius), transparent calc(var(--dot-radius) + .5px)) 0 0 / var(--dot-pitch) var(--dot-pitch);
    }
    .cast::before { content: ""; position: absolute; inset: 0; z-index: -1; background: inherit; }
    .tagline {
      margin: 0; padding: 14px 22px; color: var(--text-1);
      font: 700 28px/1.3 "CMU Typewriter Text", ui-monospace, monospace;
      letter-spacing: .08em; text-transform: uppercase;
    }
    /* 53 modules (45 + a 4-module quiet zone) at exactly 8px each. */
    .qr { flex: none; display: block; padding: 0; background: #FFFFFF; }
    .qr img { display: block; width: 424px; height: 424px; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="text">
      <h1 class="wordmark"><span><img src="pix-logo.svg" alt="Pix"></span>.joseli.to</h1>
      <p class="tagline cast">Me apoie com qualquer valor</p>
    </div>
    <div class="qr cast"><img src="og-qr.svg" alt=""></div>
  </div>
</body>
</html>
