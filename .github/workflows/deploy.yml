name: Deploy

on:
  push:
    branches: [main]
    paths: ['site/**', 'template.html', 'build.py', 'bin/deploy']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that site/index.html matches the template
        run: |
          ./build.py
          git diff --exit-code -- site/index.html
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 bin/deploy
